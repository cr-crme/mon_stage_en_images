org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 opt-outs, still required as of Flutter 3.47.9:
# - builtInKotlin: flutter_tts (4.2.5) applies the kotlin-android plugin unconditionally.
# - newDsl: the Flutter Gradle plugin itself does not support the new DSL yet.
android.builtInKotlin=false
android.newDsl=false
